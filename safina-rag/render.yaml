services:
  # Backend API
  - type: web
    name: safina-rag-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      cd backend
      pip install -r requirements.txt
    startCommand: |
      cd backend
      python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: safina-redis
          property: connectionString
      - key: OLLAMA_HOST
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: tinyllama
      - key: CUSTOMER_CACHE_TTL
        value: 86400
      - key: QUERY_CACHE_TTL
        value: 1800
    healthCheckPath: /health

  # Redis Cache
  - type: redis
    name: safina-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # Frontend (Static Site)
  - type: web
    name: safina-rag-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://safina-rag-backend.onrender.com/api/*